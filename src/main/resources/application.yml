server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false

app:
  messaging:
    retry:
      max-attempts: 3 # intentos totales, incluido el inicial
      initial-delay: 1s
      multiplier: 2
      max-delay: 10s
  outbox:
    poll-interval-ms: 1000 # @Scheduled lee este valor directamente
    batch-size: 50
    confirm-timeout: 5s

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

info:
  app:
    name: ${spring.application.name}
    description: Order Service
    version: ${APP_VERSION:1.0.0}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
